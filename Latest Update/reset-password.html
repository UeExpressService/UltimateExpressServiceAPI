<!DOCTYPE html>
<html lang="en" data-page="reset-password">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password - Ultimate Express</title>
    <script src="api-config.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main class="container">
        <header class="form-header"><h1>Choose a new password</h1><p>Use at least 12 characters.</p></header>
        <section class="form-content">
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </div>
                <p class="message" id="resetMessage" role="status" aria-live="polite"></p>
                <button class="submit-btn" type="submit">Change password</button>
            </form>
            <a class="back-link" href="forgot-password.html">Request a new reset link</a>
            <a class="back-link" href="login.html">Back to login</a>
        </section>
    </main>
    <script>
        let resetToken = new URLSearchParams(window.location.search).get('token') || '';
        const resetForm = document.getElementById('resetPasswordForm');
        const resetButton = resetForm.querySelector('button[type="submit"]');
        const resetMessage = document.getElementById('resetMessage');
        if (!/^[A-Za-z0-9_-]{40,50}$/.test(resetToken)) {
            resetMessage.textContent = 'This reset link is missing or invalid. Request a new reset link.';
            resetButton.disabled = true;
        }
        resetForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (resetButton.disabled) return;
            const message = resetMessage;
            const password = document.getElementById('newPassword').value;
            const confirmation = document.getElementById('confirmPassword').value;
            if (password !== confirmation) {
                message.textContent = 'The passwords do not match.';
                return;
            }
            const button = resetButton;
            button.disabled = true;
            message.textContent = 'Changing password...';
            try {
                const response = await fetch(`${window.UE_API_URL}/customer/password-reset/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, password })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'Unable to change the password.');
                message.textContent = data.message || 'Password changed. You can now sign in with your new password.';
                resetForm.reset();
                resetToken = '';
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (error) {
                console.error('Password reset confirmation failed:', error);
                message.textContent = error.message || 'Unable to contact the password reset service.';
            } finally {
                button.disabled = !resetToken;
            }
        });
    </script>
</body>
</html>
