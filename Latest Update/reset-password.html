<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password - Ultimate Express</title>
    <link rel="stylesheet" href="auth.css">
    <script src="api-config.js"></script>
    <style>
        .message { margin: 14px 0; font-size: 14px; color: #fff; }
        .back-link { display: block; margin-top: 18px; text-align: center; color: #fff; }
    </style>
</head>
<body>
    <main class="container">
        <header class="form-header"><h1>Choose a new password</h1><p>Use at least 12 characters.</p></header>
        <section class="form-content">
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </div>
                <p class="message" id="resetMessage" role="status" aria-live="polite"></p>
                <button class="submit-btn" type="submit">Change password</button>
            </form>
            <a class="back-link" href="login.html">Back to login</a>
        </section>
    </main>
    <script>
        const resetToken = new URLSearchParams(window.location.search).get('token') || '';
        document.getElementById('resetPasswordForm').addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('resetMessage');
            const password = document.getElementById('newPassword').value;
            const confirmation = document.getElementById('confirmPassword').value;
            if (password !== confirmation) {
                message.textContent = 'The passwords do not match.';
                return;
            }
            const button = event.currentTarget.querySelector('button[type="submit"]');
            button.disabled = true;
            message.textContent = 'Changing password...';
            try {
                const response = await fetch(`${window.UE_API_URL}/customer/password-reset/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to change the password.');
                message.textContent = data.message;
                event.currentTarget.reset();
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (error) {
                console.error('Password reset confirmation failed:', error);
                message.textContent = error.message || 'Unable to contact the password reset service.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
