<!DOCTYPE html>
<html lang="en" data-page="supervisor">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard - Ultimate Express</title>
    <script src="api-config.js"></script>
    <script src="auth.js"></script>
    <script src="ue-dialog.js"></script>
    <script>if (!requireRole('supervisor')) document.documentElement.style.display = 'none';</script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">
            <img src="images/logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/40x40?text=UE'">
            Ultimate<span>Express</span>
        </a>
        <div class="nav-right">
            <div class="user-profile">
                <div class="user-info">
                    <span class="name">Loading...</span>
                    <span class="role">Supervisor</span>
                </div>
                <a href="login.html?logout=1" class="logout-btn"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="page-header">
            <div>
                <h1><i class="bi bi-clipboard-data ue-text-primary"></i> Fleet Supervisor Dashboard</h1>
                <p>Manage drivers, trucks, and fleet resources for dispatch operations</p>
            </div>
            <button class="btn-add" type="button" onclick="downloadFleetReport()">
                <i class="bi bi-download"></i> Export Fleet Report
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
                <div class="stat-details">
                    <h3 id="totalDrivers">0</h3>
                    <p>Total Drivers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="bi bi-truck"></i></div>
                <div class="stat-details">
                    <h3 id="totalTrucks">0</h3>
                    <p>Total Trucks</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="bi bi-person-check-fill"></i></div>
                <div class="stat-details">
                    <h3 id="availableDrivers">0</h3>
                    <p>Available Drivers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red"><i class="bi bi-fuel-pump"></i></div>
                <div class="stat-details">
                    <h3 id="availableTrucks">0</h3>
                    <p>Available Trucks</p>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Drivers Section -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="bi bi-people"></i> Driver Management
                    </div>
                    <button class="btn-add" id="addDriverBtn">
                        <i class="bi bi-plus-lg"></i> Add Driver
                    </button>
                </div>
                <div class="card-body">
                    <div class="resource-filters">
                        <input id="driverSearch" type="search" placeholder="Search driver name" aria-label="Search driver name" oninput="renderDrivers()">
                        <select id="driverStatusFilter" aria-label="Filter drivers by status" onchange="renderDrivers()">
                            <option value="">All statuses</option><option value="available">Available</option><option value="busy">On Trip</option><option value="maintenance">Maintenance</option>
                        </select>
                    </div>
                    <div id="driversList"></div>
                </div>
            </div>

            <!-- Trucks Section -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="bi bi-truck"></i> Truck Management
                    </div>
                    <button class="btn-add" id="addTruckBtn">
                        <i class="bi bi-plus-lg"></i> Add Truck
                    </button>
                </div>
                <div class="card-body">
                    <div class="resource-filters">
                        <input id="truckSearch" type="search" placeholder="Search plate number" aria-label="Search truck plate number" oninput="renderTrucks()">
                        <select id="truckStatusFilter" aria-label="Filter trucks by status" onchange="renderTrucks()">
                            <option value="">All statuses</option><option value="available">Available</option><option value="busy">On Trip</option><option value="maintenance">Maintenance</option>
                        </select>
                    </div>
                    <div id="trucksList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Driver Modal -->
    <div class="modal-overlay" id="driverModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="bi bi-person-badge"></i> <span id="driverModalTitle">Add New Driver</span></div>
                <span class="modal-close" onclick="closeDriverModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="driverForm">
                    <input type="hidden" id="driverId" value="">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="driverName" required>
                        </div>
                        <div class="form-group">
                            <label>License Number *</label>
                            <input type="text" id="driverLicense" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" id="driverPhone" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="driverEmail">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="text" id="driverExperience" placeholder="e.g. 5 years">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="driverStatus">
                            <option value="available">Available</option>
                            <option value="busy">On Trip</option>
                            <option value="maintenance">On Leave / Maintenance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Notes / Specialization</label>
                        <textarea id="driverNotes" rows="2" placeholder="e.g. Long haul specialist, Hazmat certified"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeDriverModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveDriver()">Save Driver</button>
            </div>
        </div>
    </div>

    <!-- Truck Modal -->
    <div class="modal-overlay" id="truckModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title"><i class="bi bi-truck"></i> <span id="truckModalTitle">Add New Truck</span></div>
                <span class="modal-close" onclick="closeTruckModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="truckForm">
                    <input type="hidden" id="truckId" value="">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Plate Number *</label>
                            <input type="text" id="truckPlate" required>
                        </div>
                        <div class="form-group">
                            <label>Truck Type *</label>
                            <input type="text" id="truckType" list="truckTypeList" required>
                            <datalist id="truckTypeList"></datalist>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Capacity (kg) *</label>
                            <input type="text" id="truckCapacity" placeholder="e.g. 15,000 kg">
                        </div>
                        <div class="form-group">
                            <label>Current Location</label>
                            <input type="text" id="truckLocation" placeholder="e.g. Manila">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="truckStatus">
                            <option value="available">Available</option>
                            <option value="busy">On Trip</option>
                            <option value="maintenance">Maintenance</option>
                        </select>
                    </div>
                    <div class="form-group ue-checkbox-row">
                        <input type="checkbox" id="truckThirdParty">
                        <label for="truckThirdParty" class="ue-checkbox-label">Third-party / Partner truck</label>
                    </div>
                    <div class="form-group">
                        <label>Notes / Special Features</label>
                        <textarea id="truckNotes" rows="2" placeholder="e.g. Refrigerated, tail lift, GPS equipped"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeTruckModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveTruck()">Save Truck</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="bi bi-check-circle-fill"></i><span id="toastMessage">Success</span></div>

    <script>
        // Initial Data (Synced with Dispatcher Dashboard)
        const API_URL = window.UE_API_URL;
        let drivers = [];
        let trucks = [];
        const truckTypeSuggestions = [
            '4-Wheeler L300', '6-Wheeler Closed Van', '6-Wheeler Dropside',
            '10-Wheeler Wing Van', 'Trailer Truck', 'Box Truck', 'Open Truck',
            'Refrigerated Truck', 'Flatbed Truck', 'Stake Truck', 'Partner Box Truck'
        ];

        function populateTruckTypeOptions() {
            document.getElementById('truckTypeList').innerHTML = truckTypeSuggestions
                .map(type => `<option value="${escapeHtml(type)}"></option>`).join('');
        }

        async function loadSupervisorData(notifyOnError = true) {
            await Promise.all([fetchDrivers(notifyOnError), fetchTrucks(notifyOnError)]);
            updateStats();
            renderDrivers();
            renderTrucks();
        }

        async function fetchDrivers(notifyOnError = true) {
            try {
                const res = await fetch(`${API_URL}/drivers`, { headers: authenticatedApiHeaders() });
                if (!res.ok) throw new Error('Failed to fetch drivers');
                const data = await res.json();
                drivers = data.map(driver => ({
                    ...driver,
                    id: String(driver.id),
                    license: driver.license || driver.license_number || '',
                    experience: driver.experience || '',
                    email: driver.email || '',
                    notes: driver.notes || ''
                }));
            } catch (err) {
                console.error('Driver load error:', err);
                if (notifyOnError) showToast('Unable to load drivers from backend.', 'error');
                if (notifyOnError) drivers = [];
            }
        }

        async function fetchTrucks(notifyOnError = true) {
            try {
                const res = await fetch(`${API_URL}/trucks`, { headers: authenticatedApiHeaders() });
                if (!res.ok) throw new Error('Failed to fetch trucks');
                const data = await res.json();
                trucks = data.map(truck => ({
                    ...truck,
                    id: String(truck.id),
                    plate: truck.plate || truck.license_plate || '',
                    capacity: truck.capacity || '',
                    location: truck.location || '',
                    notes: truck.notes || '',
                    third_party: Boolean(truck.third_party)
                }));
            } catch (err) {
                console.error('Truck load error:', err);
                if (notifyOnError) showToast('Unable to load trucks from backend.', 'error');
                if (notifyOnError) trucks = [];
            }
        }

        function getFilteredDrivers() {
            const search = document.getElementById('driverSearch').value.trim().toLowerCase();
            const status = document.getElementById('driverStatusFilter').value;
            return drivers.filter(driver =>
                String(driver.name || '').toLowerCase().includes(search) && (!status || driver.status === status)
            );
        }

        function renderDrivers() {
            const container = document.getElementById('driversList');
            const visibleDrivers = getFilteredDrivers();
            if (visibleDrivers.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="bi bi-people"></i><p>${drivers.length ? 'No drivers match these filters.' : 'No drivers added yet.'}</p></div>`;
                return;
            }
            container.innerHTML = `
                <table class="resource-table">
                    <thead>
                        <tr><th>Name</th><th>License</th><th>Contact</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${visibleDrivers.map(driver => `
                            <tr>
                                <td><strong>${escapeHtml(driver.name)}</strong><br><small class="ue-text-muted">${escapeHtml(driver.experience || 'N/A')}</small></td>
                                <td>${escapeHtml(driver.license)}</td>
                                <td>${escapeHtml(driver.phone)}</td>
                                <td><span class="status-badge status-${driver.status}">${driver.status === 'available' ? 'Available' : driver.status === 'busy' ? 'On Trip' : 'Maintenance'}</span></td>
                                <td class="action-buttons">
                                    <button class="btn-icon edit" onclick="editDriver('${driver.id}')"><i class="bi bi-pencil"></i></button>
                                    <button class="btn-icon delete" onclick="deleteDriver('${driver.id}')"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function getFilteredTrucks() {
            const search = document.getElementById('truckSearch').value.trim().toLowerCase();
            const status = document.getElementById('truckStatusFilter').value;
            return trucks.filter(truck =>
                String(truck.plate || '').toLowerCase().includes(search) && (!status || truck.status === status)
            );
        }

        function renderTrucks() {
            const container = document.getElementById('trucksList');
            const visibleTrucks = getFilteredTrucks();
            if (visibleTrucks.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="bi bi-truck"></i><p>${trucks.length ? 'No trucks match these filters.' : 'No trucks added yet.'}</p></div>`;
                return;
            }
            container.innerHTML = `
                <table class="resource-table">
                    <thead><tr><th>Plate #</th><th>Type</th><th>Capacity</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${visibleTrucks.map(truck => `
                            <tr>
                                <td><strong>${escapeHtml(truck.plate)}</strong><br><small class="ue-text-muted">${escapeHtml(truck.location || 'N/A')}</small></td>
                                <td>${escapeHtml(truck.type)}<br><span class="ue-ownership-badge ${truck.third_party ? 'ue-ownership-partner' : 'ue-ownership-owned'}">${truck.third_party ? 'Third-Party' : 'Owned'}</span></td>
                                <td>${escapeHtml(truck.capacity)}</td>
                                <td><span class="status-badge status-${truck.status}">${truck.status === 'available' ? 'Available' : truck.status === 'busy' ? 'On Trip' : 'Maintenance'}</span></td>
                                <td class="action-buttons">
                                    <button class="btn-icon edit" onclick="editTruck('${truck.id}')"><i class="bi bi-pencil"></i></button>
                                    <button class="btn-icon delete" onclick="deleteTruck('${truck.id}')"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function updateStats() {
            document.getElementById('totalDrivers').innerText = drivers.length;
            document.getElementById('totalTrucks').innerText = trucks.length;
            document.getElementById('availableDrivers').innerText = drivers.filter(d => d.status === 'available').length;
            document.getElementById('availableTrucks').innerText = trucks.filter(t => t.status === 'available').length;
        }

        function refreshUI() {
            renderDrivers();
            renderTrucks();
            updateStats();
        }

        function csvCell(value) {
            let text = String(value ?? '');
            if (/^[\s]*[=+\-@]/.test(text)) text = `'${text}`;
            return `"${text.replace(/"/g, '""')}"`;
        }

        function downloadFleetReport() {
            const visibleDrivers = getFilteredDrivers();
            const visibleTrucks = getFilteredTrucks();
            const rows = [
                ['Ultimate Express Fleet Report', new Date().toLocaleString()],
                [],
                ['FILTERED FLEET SUMMARY', 'Count'],
                ['Drivers Shown', visibleDrivers.length],
                ['Trucks Shown', visibleTrucks.length],
                ['Available Drivers Shown', visibleDrivers.filter(driver => driver.status === 'available').length],
                ['Available Trucks Shown', visibleTrucks.filter(truck => truck.status === 'available').length],
                [],
                ['DRIVERS SHOWN'],
                ['ID', 'Name', 'License Number', 'Phone', 'Email', 'Experience', 'Status', 'Notes', 'Created At'],
                ...visibleDrivers.map(driver => [
                    driver.id, driver.name, driver.license, driver.phone, driver.email,
                    driver.experience, driver.status, driver.notes, driver.created_at
                ]),
                [],
                ['TRUCKS SHOWN'],
                ['ID', 'Plate Number', 'Type', 'Capacity', 'Location', 'Status', 'Ownership', 'Daily Rate', 'Notes', 'Created At'],
                ...visibleTrucks.map(truck => [
                    truck.id, truck.plate, truck.type, truck.capacity, truck.location,
                    truck.status, truck.third_party ? 'Third-Party' : 'Owned',
                    truck.daily_rate, truck.notes, truck.created_at
                ])
            ];
            const csv = rows.map(row => row.map(csvCell).join(',')).join('\r\n');
            const link = document.createElement('a');
            const reportUrl = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
            link.href = reportUrl;
            link.download = `ultimate-express-fleet-report-${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(reportUrl), 0);
        }

        // Driver CRUD
        function openDriverModal(driver = null) {
            if (driver) {
                document.getElementById('driverModalTitle').innerText = 'Edit Driver';
                document.getElementById('driverId').value = driver.id;
                document.getElementById('driverName').value = driver.name;
                document.getElementById('driverLicense').value = driver.license;
                document.getElementById('driverPhone').value = driver.phone;
                document.getElementById('driverEmail').value = driver.email || '';
                document.getElementById('driverExperience').value = driver.experience || '';
                document.getElementById('driverStatus').value = driver.status;
                document.getElementById('driverNotes').value = driver.notes || '';
            } else {
                document.getElementById('driverModalTitle').innerText = 'Add New Driver';
                document.getElementById('driverForm').reset();
                document.getElementById('driverId').value = '';
                document.getElementById('driverStatus').value = 'available';
            }
            document.getElementById('driverModal').classList.add('active');
        }

        function closeDriverModal() {
            document.getElementById('driverModal').classList.remove('active');
        }

        async function saveDriver() {
            const id = document.getElementById('driverId').value;
            const driverData = {
                name: document.getElementById('driverName').value,
                license: document.getElementById('driverLicense').value,
                phone: document.getElementById('driverPhone').value,
                email: document.getElementById('driverEmail').value,
                experience: document.getElementById('driverExperience').value,
                status: document.getElementById('driverStatus').value,
                notes: document.getElementById('driverNotes').value
            };

            if (!driverData.name || !driverData.license || !driverData.phone) {
                showToast('Please fill all required fields', 'error');
                return;
            }

            try {
                const payload = {
                    name: driverData.name,
                    license_number: driverData.license,
                    phone: driverData.phone,
                    status: driverData.status,
                    email: driverData.email,
                    experience: driverData.experience,
                    notes: driverData.notes
                };
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/drivers/${id}` : `${API_URL}/drivers`;
                const res = await fetch(url, {
                    method,
                    headers: authenticatedApiHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const error = await res.json().catch(() => ({}));
                    throw new Error(error.error || `Driver save failed (${res.status})`);
                }
                const saved = await res.json();

                if (id) {
                    drivers = drivers.map(d => d.id === id ? { ...d, id, ...driverData } : d);
                    showToast('Driver updated successfully', 'success');
                } else {
                    drivers.push({ id: saved.id ? saved.id.toString() : `DRV-${Date.now()}`, ...driverData });
                    showToast('Driver added successfully', 'success');
                }
                closeDriverModal();
                refreshUI();
            } catch (err) {
                console.error('Save driver error:', err);
                showToast(err.message || 'Unable to save driver.', 'error');
            }
        }

        function editDriver(id) {
            const driver = drivers.find(d => d.id === id);
            if (driver) openDriverModal(driver);
        }

        async function deleteDriver(id) {
            if (!(await UE.confirm('Are you sure you want to delete this driver?', { type: 'danger', title: 'Delete driver', confirmText: 'Delete driver' }))) return;
            try {
                const res = await fetch(`${API_URL}/drivers/${id}`, { method: 'DELETE', headers: authenticatedApiHeaders() });
                if (!res.ok) throw new Error('Delete failed');
                drivers = drivers.filter(d => d.id !== id);
                refreshUI();
                showToast('Driver deleted', 'success');
            } catch (err) {
                console.error('Delete driver error:', err);
                showToast('Unable to delete driver. Check backend server.', 'error');
            }
        }

        // Truck CRUD
        function openTruckModal(truck = null) {
            if (truck) {
                document.getElementById('truckModalTitle').innerText = 'Edit Truck';
                document.getElementById('truckId').value = truck.id;
                document.getElementById('truckPlate').value = truck.plate;
                document.getElementById('truckType').value = truck.type;
                document.getElementById('truckCapacity').value = truck.capacity;
                document.getElementById('truckLocation').value = truck.location || '';
                document.getElementById('truckStatus').value = truck.status;
                document.getElementById('truckThirdParty').checked = Boolean(truck.third_party);
                document.getElementById('truckNotes').value = truck.notes || '';
            } else {
                document.getElementById('truckModalTitle').innerText = 'Add New Truck';
                document.getElementById('truckForm').reset();
                document.getElementById('truckId').value = '';
                document.getElementById('truckStatus').value = 'available';
                document.getElementById('truckThirdParty').checked = false;
                document.getElementById('truckType').value = truckTypeSuggestions[0];
            }
            document.getElementById('truckModal').classList.add('active');
        }

        function closeTruckModal() {
            document.getElementById('truckModal').classList.remove('active');
        }

        async function saveTruck() {
            const id = document.getElementById('truckId').value;
            const truckData = {
                plate: document.getElementById('truckPlate').value,
                type: document.getElementById('truckType').value,
                capacity: document.getElementById('truckCapacity').value,
                location: document.getElementById('truckLocation').value,
                status: document.getElementById('truckStatus').value,
                notes: document.getElementById('truckNotes').value,
                third_party: document.getElementById('truckThirdParty').checked
            };

            if (!truckData.plate || !truckData.type || !truckData.capacity) {
                showToast('Please fill all required fields', 'error');
                return;
            }

            try {
                const payload = {
                    type: truckData.type,
                    license_plate: truckData.plate,
                    daily_rate: 0,
                    status: truckData.status,
                    third_party: truckData.third_party,
                    capacity: truckData.capacity,
                    location: truckData.location,
                    notes: truckData.notes
                };
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/trucks/${id}` : `${API_URL}/trucks`;
                const res = await fetch(url, {
                    method,
                    headers: authenticatedApiHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const error = await res.json().catch(() => ({}));
                    throw new Error(error.error || `Truck save failed (${res.status})`);
                }
                const saved = await res.json();

                if (id) {
                    trucks = trucks.map(t => t.id === id ? { ...t, id, ...truckData } : t);
                    showToast('Truck updated successfully', 'success');
                } else {
                    trucks.push({ id: saved.id ? saved.id.toString() : `TRK-${Date.now()}`, ...truckData });
                    showToast('Truck added successfully', 'success');
                }
                closeTruckModal();
                refreshUI();
            } catch (err) {
                console.error('Save truck error:', err);
                showToast(err.message || 'Unable to save truck.', 'error');
            }
        }

        function editTruck(id) {
            const truck = trucks.find(t => t.id === id);
            if (truck) openTruckModal(truck);
        }

        async function deleteTruck(id) {
            if (!(await UE.confirm('Are you sure you want to delete this truck?', { type: 'danger', title: 'Delete truck', confirmText: 'Delete truck' }))) return;
            try {
                const res = await fetch(`${API_URL}/trucks/${id}`, { method: 'DELETE', headers: authenticatedApiHeaders() });
                if (!res.ok) throw new Error('Delete failed');
                trucks = trucks.filter(t => t.id !== id);
                refreshUI();
                showToast('Truck deleted', 'success');
            } catch (err) {
                console.error('Delete truck error:', err);
                showToast('Unable to delete truck. Check backend server.', 'error');
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.className = `toast ${type}`;
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        window.onclick = function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        };

        document.getElementById('addDriverBtn').onclick = () => openDriverModal(null);
        document.getElementById('addTruckBtn').onclick = () => openTruckModal(null);
        populateTruckTypeOptions();
        loadSupervisorData();
        setInterval(() => {
            if (!document.hidden && !document.querySelector('.modal-overlay.active')) loadSupervisorData(false);
        }, 15000);
    </script>
</body>
</html>
