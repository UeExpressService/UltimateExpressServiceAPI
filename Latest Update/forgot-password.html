<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Ultimate Express</title>
    <link rel="stylesheet" href="auth.css">
    <script src="api-config.js"></script>
    <style>
        .message { margin: 14px 0; font-size: 14px; color: #fff; }
        .back-link { display: block; margin-top: 18px; text-align: center; color: #fff; }
    </style>
</head>
<body>
    <main class="container">
        <header class="form-header"><h1>Reset customer password</h1><p>We will email you a confirmation link if this is a customer account.</p></header>
        <section class="form-content">
            <form id="resetRequestForm">
                <div class="form-group">
                    <label for="resetEmail">Customer email address</label>
                    <input id="resetEmail" type="email" autocomplete="email" required maxlength="254">
                </div>
                <p class="message" id="resetMessage" role="status" aria-live="polite"></p>
                <button class="submit-btn" type="submit">Send confirmation email</button>
            </form>
            <a class="back-link" href="login.html">Back to login</a>
        </section>
    </main>
    <script>
        document.getElementById('resetRequestForm').addEventListener('submit', async event => {
            event.preventDefault();
            const message = document.getElementById('resetMessage');
            const button = event.currentTarget.querySelector('button[type="submit"]');
            button.disabled = true;
            message.textContent = 'Sending request...';
            try {
                const response = await fetch(`${window.UE_API_URL}/customer/password-reset/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('resetEmail').value.trim() })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to send the request.');
                message.textContent = data.message;
            } catch (error) {
                console.error('Password reset request failed:', error);
                message.textContent = error.message || 'Unable to contact the password reset service.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
